<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <style>
    .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2px; }
    .title { font: bold 16px sans-serif; fill: #0f172a; }
    .field { font: 14px sans-serif; fill: #0f172a; }
    .relation { stroke: #0f172a; stroke-width: 2px; marker-end: url(#arrow); }
    .line-label { font: 12px sans-serif; fill: #0f172a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect x="40" y="40" width="260" height="220" class="box" rx="10" />
  <text x="60" y="70" class="title">users</text>
  <text x="60" y="100" class="field">id: INTEGER PK</text>
  <text x="60" y="125" class="field">username: TEXT UNIQUE</text>
  <text x="60" y="150" class="field">password_hash: TEXT</text>
  <text x="60" y="175" class="field">role: TEXT</text>
  <text x="60" y="200" class="field">created_at: TEXT</text>

  <rect x="590" y="40" width="260" height="260" class="box" rx="10" />
  <text x="610" y="70" class="title">employees</text>
  <text x="610" y="100" class="field">id: INTEGER PK</text>
  <text x="610" y="125" class="field">employee_code: TEXT UNIQUE</text>
  <text x="610" y="150" class="field">full_name: TEXT</text>
  <text x="610" y="175" class="field">email: TEXT UNIQUE</text>
  <text x="610" y="200" class="field">mobile: TEXT</text>
  <text x="610" y="225" class="field">department_id: INTEGER FK</text>
  <text x="610" y="250" class="field">designation: TEXT</text>
  <text x="610" y="275" class="field">salary: REAL</text>
  <text x="610" y="300" class="field">joining_date: TEXT</text>
  <text x="610" y="325" class="field">status: TEXT</text>
  <text x="610" y="350" class="field">deleted_at: TEXT</text>

  <rect x="315" y="300" width="260" height="160" class="box" rx="10" />
  <text x="335" y="330" class="title">departments</text>
  <text x="335" y="360" class="field">id: INTEGER PK</text>
  <text x="335" y="385" class="field">name: TEXT UNIQUE</text>

  <line x1="470" y1="225" x2="590" y2="225" class="relation" />
  <text x="490" y="215" class="line-label">department_id</text>
  <text x="570" y="210" class="line-label">↔</text>

  <line x1="300" y1="160" x2="315" y2="360" class="relation" />
  <text x="285" y="260" class="line-label">department_id</text>
</svg>
